version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cyberlab-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cyberlab123}
      MYSQL_DATABASE: cyberlab
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cyberlab-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberlab-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cyberlab-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cyberlab-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - DB_PASSWORD=${DB_PASSWORD:-cyberlab123}
      - JWT_SECRET=${JWT_SECRET:-cyberlab-jwt-secret-key-change-in-production}
      - AI_API_KEY=${AI_API_KEY:-}
    volumes:
      - ../backend/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberlab-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cyberlab-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - cyberlab-net

  nginx:
    image: nginx:alpine
    container_name: cyberlab-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - cyberlab-net

volumes:
  mysql_data:
  redis_data:

networks:
  cyberlab-net:
    driver: bridge
